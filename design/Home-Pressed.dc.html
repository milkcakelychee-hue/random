<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>คำนวณ — การ์ดถูกกด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600&family=Prompt:wght@300;400;500;600&display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:linear-gradient(180deg,#F5F5F6 0%,#EDEDEE 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(10,10,10,.04),0 10px 28px rgba(10,10,10,.05);transition:transform .14s ease,background .14s ease,box-shadow .14s ease}
.card .arrow{box-shadow:0 1px 3px rgba(10,10,10,.08);transition:background .14s ease}
.card.is-pressed,.card:active{background:linear-gradient(180deg,#E9E9EB 0%,#E1E1E3 100%) !important;box-shadow:inset 0 2px 6px rgba(10,10,10,.06),0 1px 2px rgba(10,10,10,.04) !important;transform:scale(.97)}
.card.is-pressed .arrow,.card:active .arrow{background:#0A0A0A !important}
.card.is-pressed .arrow svg,.card:active .arrow svg{stroke:#FFFFFF}
.card:focus-visible,.tab:focus-visible{outline:2px solid #0A0A0A;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 60% at 50% 0%, #FFFFFF 0%, #FAFAFA 70%); overflow: hidden; font-family: 'Bai Jamjuree', sans-serif; color: #0A0A0A">

<!-- หัวข้อสองสี: ดำ + เทา -->
<div style="position: absolute; left: 24px; right: 24px; top: 72px">
<h1 style="margin: 0; font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 40px; line-height: 1.25; letter-spacing: -0.5px; color: #0A0A0A">คำนวณ</h1>
<p style="margin: 0; font-family: 'Prompt', sans-serif; font-weight: 300; font-size: 28px; line-height: 1.35; letter-spacing: -0.2px; color: #8E8E93">เลือกเครื่องมือที่ต้องการใช้</p>
</div>

<!-- กริดเครื่องมือ -->
<div style="position: absolute; left: 20px; right: 20px; top: 244px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button class="card is-pressed" type="button" style="appearance: none; border: 0; margin: 0; padding: 20px; box-sizing: border-box; height: 216px; border-radius: 28px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#B9B9BE" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
<span class="arrow" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Prompt', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.25; color: #0A0A0A">เทียบราคา</span>
<span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 400; font-size: 14px; line-height: 1.4; color: #68686D">ของชิ้นไหนคุ้มกว่า</span>
</div>
</button>
<button class="card" type="button" style="appearance: none; border: 0; margin: 0; padding: 20px; box-sizing: border-box; height: 216px; border-radius: 28px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#B9B9BE" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
<span class="arrow" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Prompt', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.25; color: #0A0A0A">ส่วนลด</span>
<span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 400; font-size: 14px; line-height: 1.4; color: #68686D">ลดไปเท่าไหร่ จ่ายเท่าไหร่</span>
</div>
</button>
<button class="card" type="button" style="appearance: none; border: 0; margin: 0; padding: 20px; box-sizing: border-box; height: 144px; grid-column: 1 / -1; border-radius: 28px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#B9B9BE" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
<span class="arrow" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Prompt', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.25; color: #0A0A0A">แปลงหน่วย</span>
<span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 400; font-size: 14px; line-height: 1.4; color: #68686D">น้ำหนัก ปริมาตร ความยาว</span>
</div>
</button>
</div>

<!-- เมนูล่างแบบแคปซูลลอย -->
<nav aria-label="เมนูหลัก" style="position: absolute; left: 20px; right: 20px; bottom: 30px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 32px; background: #F0F0F1; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 24px rgba(10,10,10,.06); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button class="tab" type="button" aria-current="page" style="appearance: none; border: 0; margin: 0; padding: 0; height: 52px; border-radius: 26px; background: #0A0A0A; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
<span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.2; color: #FFFFFF">คำนวณ</span>

<button class="tab" type="button" style="appearance: none; border: 0; margin: 0; padding: 0; height: 52px; border-radius: 26px; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#68686D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>
<span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 500; font-size: 15px; line-height: 1.2; color: #68686D">ตั้งค่า</span>
</button>
</nav>

</div>
</x-dc>

</body>
</html>
